<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STEEL Trading Desk — Release Mockup</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  body { background: #0c0905; font-family: system-ui, sans-serif; }
</style>

<body>
<div id="root"></div>

<template id="__bundler_thumbnail">
  <svg viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg">
    <rect width="120" height="80" fill="#120D09"/>
    <circle cx="60" cy="36" r="18" fill="#8B5CF6" opacity="0.8"/>
    <circle cx="60" cy="36" r="10" fill="#67E8F9" opacity="0.7"/>
    <text x="60" y="65" text-anchor="middle" fill="#D6AE6E" font-size="9" font-weight="bold">STEEL</text>
  </svg>
</template>

<script type="text/babel">
// ─── BRAND TOKENS ────────────────────────────────────────────────────────────
const B = {
  bg:        '#120D09',
  bgMid:     '#1A1108',
  panel:     '#231810',
  panelHi:   '#2E1F14',
  stroke:    'rgba(255,255,255,0.08)',
  gold:      '#D6AE6E',
  goldDim:   '#A07A42',
  cyan:      '#73F599',
  coral:     '#FC6E57',
  amber:     '#F2B547',
  purple:    '#A855F7',
  text:      '#F2EDE6',
  muted:     '#9C8E82',
  dimmed:    '#5C5048',
};

// ─── SHARED PRIMITIVES ───────────────────────────────────────────────────────
const PulseDot = ({ color = B.gold, size = 8 }) => {
  const [p, setP] = React.useState(false);
  React.useEffect(() => {
    const id = setInterval(() => setP(v => !v), 1400);
    return () => clearInterval(id);
  }, []);
  return (
    <span style={{ display:'inline-block', position:'relative', width:size, height:size, flexShrink:0 }}>
      <span style={{
        position:'absolute', inset:0,
        borderRadius:'50%', background:color,
        boxShadow:`0 0 ${size*1.2}px ${color}`,
      }}/>
      <span style={{
        position:'absolute', inset:-size*0.6,
        borderRadius:'50%',
        border:`1px solid ${color}`,
        opacity: p ? 0 : 0.6,
        transform: p ? `scale(2.2)` : 'scale(1)',
        transition:'all 1.4s ease-out',
      }}/>
    </span>
  );
};

const Tag = ({ children, color = B.gold }) => (
  <span style={{
    display:'inline-flex', alignItems:'center',
    padding:'2px 8px', borderRadius:20,
    background:`${color}18`, border:`1px solid ${color}40`,
    color, fontSize:9, fontWeight:700, letterSpacing:1.1,
    textTransform:'uppercase', whiteSpace:'nowrap',
  }}>{children}</span>
);

const Meter = ({ val = 0.7, color = B.gold, width = 80 }) => (
  <div style={{ width: typeof width === 'number' ? width : '100%', height:4, borderRadius:4, background:'rgba(255,255,255,0.07)', overflow:'hidden' }}>
    <div style={{ width:`${val*100}%`, height:'100%', borderRadius:4, background:color }}/>
  </div>
);

const Panel = ({ children, glow, style = {} }) => (
  <div style={{
    background: `linear-gradient(135deg, ${B.panelHi}, ${B.panel})`,
    border:`1px solid ${B.stroke}`,
    borderRadius:14,
    boxShadow: glow ? `0 0 28px ${glow}28, 0 6px 24px #00000055` : '0 6px 24px #00000055',
    ...style
  }}>{children}</div>
);

const Label = ({ children, color = B.muted }) => (
  <div style={{ fontSize:9, fontWeight:700, letterSpacing:1.3, textTransform:'uppercase', color }}>{children}</div>
);

const Mono = ({ children, color = B.text, size = 13 }) => (
  <span style={{ fontFamily:'monospace', fontSize:size, color, fontWeight:600 }}>{children}</span>
);

// ─── STEEL MARK SVG ─────────────────────────────────────────────────────────────
const STEELMark = ({ size = 48 }) => (
  <svg width={size} height={size} viewBox="0 0 100 100">
    <defs>
      <linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stopColor="#2E1F14"/>
        <stop offset="100%" stopColor="#120D09"/>
      </linearGradient>
    </defs>
    <rect width="100" height="100" rx="28" fill="url(#bgG)"/>
    <rect width="100" height="100" rx="28" fill="none" stroke={B.gold} strokeWidth="2.5" strokeOpacity="0.35"/>
    <circle cx="50" cy="50" r="30" fill="none" stroke={B.gold} strokeWidth="6" strokeOpacity="0.18"/>
    {/* main slash */}
    <rect x="18" y="43" width="54" height="11" rx="5.5" fill={B.gold} transform="rotate(-28 45 49)"/>
    {/* secondary slash */}
    <rect x="28" y="36" width="38" height="9" rx="4.5" fill={B.cyan} fillOpacity="0.9" transform="rotate(28 47 40)"/>
    {/* accent slash */}
    <rect x="50" y="27" width="22" height="7" rx="3.5" fill={B.coral} fillOpacity="0.92" transform="rotate(-28 61 30)"/>
    {/* pulse dot */}
    <circle cx="75" cy="25" r="5" fill={B.gold}/>
    {/* B/S text */}
    <text x="50" y="57" textAnchor="middle" fill={B.text} fontSize="18" fontWeight="900" fontFamily="Georgia,serif" letterSpacing="1">B/S</text>
  </svg>
);

// ═══════════════════════════════════════════════════════════════════════════════
// SECTION 1 — RELEASE ROADMAP
// ═══════════════════════════════════════════════════════════════════════════════

      eta: 'Week 1',
      color: B.amber,
      items: [
        { done: false, text: 'Rename bundle display name → "STEEL Trading Desk"' },
        { done: false, text: 'Audit Info.plist: CFBundleDisplayName production value' },
        { done: false, text: 'Add DisclaimerView to onboarding flow (already exists ✓)' },
        { done: false, text: 'Financial categorization: "Educational & Trading Utility"' },
      ]
    },
    {
      num: '02',
      title: 'Technical Hardening',
      eta: 'Week 1–2',
      color: B.gold,
      items: [
        { done: false, text: 'Verify sandbox + network + keychain entitlements' },
        { done: false, text: 'Replace SchwabService simulated stubs with real error states' },
        { done: false, text: 'AppIcon.appiconset: all sizes 16×16 → 512×512@2x' },
        { done: false, text: 'Add Demo Mode for App Store reviewer (no real credentials)' },
      ]
    },
    {
      num: '03',
      title: 'IAP & Freemium Split',
      eta: 'Week 2',
      color: B.cyan,
      items: [
        { done: false, text: 'Define StoreKit non-consumable: "STEEL Pro — Lifetime Unlock"' },
        { done: false, text: 'Gate: Schwab API, unlimited journal, Supreme prompt library' },
        { done: false, text: 'Free tier: Manual entry + Pre-market + Morning prompts (5 trades)' },
        { done: false, text: 'Add 7-day Pro Trial entitlement via StoreKit 2' },
      ]
    },
    {
      num: '04',
      title: 'iOS / iPhone Port',
      eta: 'Week 2–3',
      color: B.purple,
      items: [
        { done: false, text: 'SwiftUI adaptive layout: compact (iPhone) vs regular (iPad/Mac)' },
        { done: false, text: 'Bottom tab bar navigation for iOS (already uses TabView ✓)' },
        { done: false, text: 'Push notifications: SignalNotification.swift → APNs' },
        { done: false, text: 'Widget extension: Market phase + next window countdown' },
      ]
    },
    {
      num: '05',
      title: 'TestFlight & Submission',
      eta: 'Week 3',
      color: B.coral,
      items: [

        { done: false, text: 'Set Release → Manual (coordinate with community launch)' },

  ];

    { label: 'Pro — $49.99', color: B.gold, items: ['Full VIX/Volume/Technical data', 'Supreme Prompt Library', 'Unlimited journal + P/L analytics', 'Schwab API integration', 'Hard-exit automation'] },

  return (
    <div style={{ width:900, padding:40, background:B.bg, borderRadius:20 }}>
      {/* Header */}
      <div style={{ display:'flex', alignItems:'center', gap:16, marginBottom:36 }}>
        <STEELMark size={52}/>
        <div>
          <div style={{ fontSize:22, fontWeight:800, color:B.text, letterSpacing:0.5, fontFamily:'Georgia,serif' }}>STEEL Trading Desk</div>
          <div style={{ fontSize:11, color:B.muted, letterSpacing:1.4, textTransform:'uppercase', marginTop:3 }}>App Store Release Roadmap — v1.0</div>
        </div>
        <div style={{ marginLeft:'auto', display:'flex', gap:8 }}>
          <Tag color={B.amber}>macOS</Tag>
          <Tag color={B.purple}>iOS</Tag>
          <Tag color={B.cyan}>Local-First</Tag>
        </div>
      </div>

      {/* Phases */}
      <div style={{ display:'flex', flexDirection:'column', gap:12, marginBottom:36 }}>
        {phases.map((ph) => (
          <Panel key={ph.num} glow={ph.color} style={{ padding:'18px 20px' }}>
            <div style={{ display:'flex', alignItems:'flex-start', gap:16 }}>
              <div style={{ minWidth:36, fontSize:24, fontWeight:900, color:ph.color, fontFamily:'monospace', lineHeight:1 }}>{ph.num}</div>
              <div style={{ flex:1 }}>
                <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:10 }}>
                  <div style={{ fontSize:13, fontWeight:700, color:B.text }}>{ph.title}</div>
                  <Tag color={ph.color}>{ph.eta}</Tag>
                </div>
                <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:'6px 20px' }}>
                  {ph.items.map((item, i) => (
                    <div key={i} style={{ display:'flex', alignItems:'flex-start', gap:7 }}>
                      <div style={{
                        width:14, height:14, borderRadius:4, marginTop:1, flexShrink:0,

                        display:'flex', alignItems:'center', justifyContent:'center',
                      }}>
                        {item.done && <span style={{ color:'#000', fontSize:9, fontWeight:900 }}>✓</span>}
                      </div>
                      <div style={{ fontSize:11, color: item.done ? ph.color : B.muted, lineHeight:1.4 }}>{item.text}</div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </Panel>
        ))}
      </div>

      {/* Freemium Tiers */}
      <div>
        <Label color={B.muted} style={{ marginBottom:12, display:'block' }}>Freemium Structure</Label>
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12, marginTop:10 }}>
          {tiers.map((tier) => (
            <Panel key={tier.label} glow={tier.color} style={{ padding:18 }}>
              <div style={{ fontSize:12, fontWeight:700, color:tier.color, marginBottom:10, letterSpacing:0.5 }}>{tier.label}</div>
              <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
                {tier.items.map((item, i) => (
                  <div key={i} style={{ display:'flex', gap:8, alignItems:'center' }}>

                    <span style={{ fontSize:11, color:B.muted }}>{item}</span>

          ))}

      {/* Risk table */}
      <div style={{ marginTop:24, display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:10 }}>
        {[
          { risk:'Financial Regulation', impact:'High', mit:'Emphasize manual entry & journaling', color:B.coral },
          { risk:'Branding Rejection', impact:'Medium', mit:'Use "STEEL Trading Desk" display name', color:B.amber },
          { risk:'IAP Complexity', impact:'Low', mit:'Single non-consumable "Unlock All"', color:B.cyan },
        ].map(r => (
          <Panel key={r.risk} style={{ padding:14 }}>
            <Label color={r.color}>{r.impact} risk</Label>
            <div style={{ fontSize:11, fontWeight:700, color:B.text, margin:'5px 0 4px' }}>{r.risk}</div>
            <div style={{ fontSize:10, color:B.muted }}>{r.mit}</div>
          </Panel>
        ))}
      </div>
    </div>
  );
};

// ═══════════════════════════════════════════════════════════════════════════════
// SECTION 2 — iPHONE MOCKUP
// ═══════════════════════════════════════════════════════════════════════════════

const SignalRow = ({ symbol, dir, strength, label, status }) => {
  const clr = dir === 'CALLS' ? B.cyan : B.coral;
  const statusColor = status === 'ENTRY' ? B.cyan : status === 'WATCH' ? B.amber : B.coral;
  return (
    <div style={{ display:'flex', alignItems:'center', gap:10, padding:'10px 12px', background:`${clr}0D`, border:`1px solid ${clr}22`, borderRadius:10, marginBottom:7 }}>
      <PulseDot color={statusColor} size={7}/>
      <div style={{ flex:1 }}>
        <div style={{ display:'flex', alignItems:'center', gap:7, marginBottom:2 }}>
          <span style={{ fontSize:12, fontWeight:800, color:B.text, fontFamily:'monospace' }}>{symbol}</span>
          <Tag color={clr}>{dir}</Tag>
          <Tag color={statusColor}>{status}</Tag>
        </div>
        <div style={{ fontSize:9, color:B.muted, letterSpacing:0.5 }}>{label}</div>
      </div>
      <Meter val={strength} color={statusColor} width={44}/>
    </div>
  );
};

const IOSContent = () => {
  const now = new Date();
  const timeStr = now.toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit', hour12:true });

  return (
    <div style={{ background:B.bg, minHeight:'100%', fontFamily:'system-ui,sans-serif' }}>
      {/* Session header */}
      <div style={{ padding:'14px 16px 10px', borderBottom:`1px solid ${B.stroke}` }}>
        <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:8 }}>
          <STEELMark size={32}/>
          <div>
            <div style={{ fontSize:13, fontWeight:800, color:B.text, fontFamily:'Georgia,serif' }}>STEEL Trading Desk</div>
            <div style={{ fontSize:9, color:B.muted, letterSpacing:1 }}>OPEN FIRST. CLOSE HONEST.</div>
          </div>
          <div style={{ marginLeft:'auto' }}>
            <Tag color={B.cyan}>LOCAL FIRST</Tag>
          </div>
        </div>
        {/* Pulse strip */}
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:7 }}>
          {[
            { label:'Setups', val:'2', color:B.amber },
            { label:'Risk', val:'1', color:B.coral },
            { label:'Phase', val:'Close Drive', color:B.cyan },
          ].map(t => (
            <div key={t.label} style={{ padding:'8px 10px', background:`${t.color}0F`, border:`1px solid ${t.color}22`, borderRadius:9 }}>
              <div style={{ display:'flex', alignItems:'center', gap:5, marginBottom:3 }}>
                <PulseDot color={t.color} size={5}/>
                <Label color={B.dimmed}>{t.label}</Label>
              </div>
              <div style={{ fontSize:11, fontWeight:700, color:B.text }}>{t.val}</div>
            </div>
          ))}
        </div>
      </div>

      {/* Market Status */}
      <div style={{ padding:'10px 16px', borderBottom:`1px solid ${B.stroke}` }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'10px 12px', background:`${B.amber}0D`, border:`1px solid ${B.amber}28`, borderRadius:10 }}>
          <div>
            <Label color={B.dimmed}>Market Phase</Label>
            <div style={{ fontSize:14, fontWeight:700, color:B.text, marginTop:3, fontFamily:'Georgia,serif' }}>Close Drive</div>
            <div style={{ fontSize:9, color:B.muted, marginTop:2 }}>Good tape pays. Dead tape wastes attention.</div>
          </div>
          <PulseDot color={B.amber} size={14}/>
        </div>
      </div>

      {/* Signals */}
      <div style={{ padding:'10px 16px' }}>
        <div style={{ display:'flex', alignItems:'center', gap:7, marginBottom:10 }}>
          <span style={{ fontSize:9, color:B.muted }}>⚡</span>
          <Label color={B.muted}>Signals Live</Label>
          <div style={{ marginLeft:'auto' }}>
            <Tag color={B.amber}>2 ACTIVE</Tag>
          </div>
        </div>
        <SignalRow symbol="VXX" dir="CALLS" strength={0.82} label="3:45 PM Institutional • Vol 310% avg" status="ENTRY"/>
        <SignalRow symbol="SPY" dir="PUTS" strength={0.54} label="Close Drive • VWAP rejected • Vol building" status="WATCH"/>
      </div>

      {/* Active Risk */}
      <div style={{ padding:'0 16px 10px' }}>
        <div style={{ display:'flex', alignItems:'center', gap:7, marginBottom:10 }}>
          <span style={{ fontSize:9, color:B.coral }}>🔥</span>
          <Label color={B.muted}>Active Risk</Label>
        </div>
        <div style={{ padding:'11px 13px', background:`${B.coral}0D`, border:`1px solid ${B.coral}22`, borderRadius:10 }}>
          <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:7 }}>
            <div style={{ display:'flex', alignItems:'center', gap:8 }}>
              <Mono size={12}>VXX</Mono>
              <Tag color={B.cyan}>CALLS</Tag>
            </div>
            <div style={{ textAlign:'right' }}>
              <div style={{ fontSize:9, color:B.muted, letterSpacing:0.8 }}>LIVE P/L</div>
              <Mono color={B.cyan} size={13}>+$142.00</Mono>
            </div>
          </div>
          <Meter val={0.68} color={B.cyan} width={200}/>
          <div style={{ fontSize:9, color:B.muted, marginTop:4 }}>68% to target · Entry $32.40 · Target $33.20</div>
        </div>
      </div>

      {/* Close warning */}
      <div style={{ margin:'0 16px 12px', padding:'10px 13px', background:`${B.amber}12`, border:`1px solid ${B.amber}40`, borderRadius:10 }}>
        <div style={{ display:'flex', alignItems:'center', gap:8 }}>
          <span style={{ fontSize:13 }}>⏰</span>

          { icon:'〰️', label:'VXX', active:false },
          { icon:'⚡', label:'Live', active:false },
          { icon:'⚙️', label:'Settings', active:false },
        ].map(tab => (
          <div key={tab.label} style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:3, opacity: tab.active ? 1 : 0.45 }}>
            <span style={{ fontSize:16 }}>{tab.icon}</span>
            <div style={{ fontSize:8, fontWeight:700, color: tab.active ? B.gold : B.muted, letterSpacing:0.5 }}>{tab.label}</div>
          </div>

};

  <div style={{ width:400, display:'flex', justifyContent:'center', padding:'20px 0' }}>
    <IOSDevice dark={true}>
